user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Performance optimizations
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # Max body size for 20MB bot zip uploads
    client_max_body_size 25M;
    client_body_buffer_size 1M;

    # Upstream to FastAPI API backend
    upstream bothost_api {
        server backend:8000;
        keepalive 64;
    }

    # Upstream to Frontend static server
    upstream bothost_frontend {
        server frontend:3000;
        keepalive 32;
    }

    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Request ID propagation
        add_header X-Request-ID $request_id always;

        # API Routes
        location /api/ {
            proxy_pass http://bothost_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;

            proxy_connect_timeout 5s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }

        # SSE Log Streaming & Job Progress (Buffering disabled for real-time delivery)
        location ~ ^/api/v1/(bots/.*/logs/sse|jobs/.*/sse)$ {
            proxy_pass http://bothost_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Request-ID $request_id;

            # Disable buffering for SSE streaming
            proxy_buffering off;
            proxy_cache off;
            chunked_transfer_encoding off;
            proxy_read_timeout 3600s;
        }

        # Prometheus Metrics Route
        location /metrics {
            proxy_pass http://bothost_api/metrics;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Health Checks
        location ~ ^/(healthz|readyz)$ {
            proxy_pass http://bothost_api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }

        # Frontend Application & Static Assets (with caching headers)
        location / {
            proxy_pass http://bothost_frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Browser cache for static assets
            location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2)$ {
                proxy_pass http://bothost_frontend;
                expires 7d;
                add_header Cache-Control "public, no-transform";
            }
        }
    }
}
